spring.application.name=doubtconnect
spring.datasource.url=jdbc:postgresql://localhost:5432/doubtconnect
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=YOUR_JWT_SECRET_MIN_32_CHARS
aes.secret=YOUR_AES_SECRET_MIN_16_CHARS

razorpay.key.id=rzp_test_YOUR_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET
razorpay.commission.percent=5
google.oauth.client-id=your_google_client_id
google.oauth.client-secret=your_google_client_secret
google.oauth.redirect-uri=http://localhost:8080/oauth/google/callback
google.calendar.scope=https://www.googleapis.com/auth/calendar